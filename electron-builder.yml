appId: com.rtslytics.app
productName: RTSLytics
copyright: AOE4 Companion. AoE4 © Microsoft (Game Content Usage Rules).

directories:
  output: release
  buildResources: build

# Only the built output + production deps are packaged.
files:
  - out/**/*
  - package.json

# Produced from the pinned aoe4world/replays-api revision by
# `npm run prepare:replays-api` immediately before packaging. The process is
# bound to 127.0.0.1 and launched only as a parser fallback.
extraResources:
  - from: build/replays-api
    to: replays-api

# Native binaries must live outside the asar archive so they can be loaded at
# runtime. Disable directory-level auto-unpacking so the packages' JavaScript
# and source files stay inside the archive.
asar:
  smartUnpack: false
asarUnpack:
  - '**/node_modules/better-sqlite3/**/*.node'
  - '**/node_modules/uiohook-napi/**/*.node'

win:
  icon: build/icon.ico
  # The overlay must share (or exceed) the game's UI privilege level, otherwise
  # Windows can block it from appearing above an elevated game window. Request
  # elevation for every Windows launch, including the portable build.
  requestedExecutionLevel: requireAdministrator
  # No installer — a single self-contained portable .exe (double-click to run)
  # plus the unpacked folder (release/win-unpacked/RTSLytics.exe).
  target:
    - portable
    - dir
  artifactName: ${productName}-${version}-portable.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
  # Reuse a stable extraction dir between launches (faster relaunch). Settings &
  # history live under %APPDATA%/RTSLytics regardless, so they always persist.
  unpackDirName: RTSLytics

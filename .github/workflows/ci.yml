name: CI

# Typecheck, lint, and test on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips the postinstall native rebuild (electron-builder
        # install-app-deps -> uiohook-napi / better-sqlite3), which needs X11 +
        # Electron headers and is not required for typecheck/lint/test. The suite is
        # pure Node; the history-store test probes for the native SQLite binary and
        # falls back to the JSON store when it is absent.
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          # Keep the worker count bounded for the large bundled guide/icon corpus,
          # but don't serialize the long iconification suite past Vitest's worker
          # heartbeat timeout on ubuntu-latest.
          # The two corpus-wide icon suites are intentionally kept in CI, but
          # run in their own processes. When they share a Vitest worker job the
          # 60s birpc heartbeat can expire while the next corpus is rendering;
          # process isolation keeps the full suite deterministic on Ubuntu.
          npx vitest run --pool=forks --maxWorkers=2 --minWorkers=1 \
            --exclude src/domain/__tests__/buildOrderNotes.test.ts \
            --exclude src/renderer/overlay/__tests__/buildIcons.test.ts
          for slice in 0 1 2; do
            RTSLYTICS_CORPUS_SLICE="$slice" npx vitest run --pool=forks src/domain/__tests__/buildOrderNotes.test.ts
          done
          for slice in 0 1 2 3 4 5; do
            RTSLYTICS_CORPUS_SLICE="$slice" npx vitest run --pool=forks src/renderer/overlay/__tests__/buildIcons.test.ts
          done

      - name: Build production bundles
        run: npm run bundle
